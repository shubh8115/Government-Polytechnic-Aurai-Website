services:
  - type: web
    name: government-polytechnic-aurai
    runtime: python
    buildCommand: ./build.sh
    startCommand: python -m gunicorn myproject.asgi:application -k uvicorn.workers.UvicornWorker
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"

{% extends 'base.html'%}
{% load static%}
{% block childpage %}
 <!--gallery-->
       <div class="row py-3 bg-color1">
        <div class="col-sm-10 mx-auto">
          <div class="row">
            <div class="col-sm-12 fs-2  text-dark">Image <b class="text-color1">Gallery</b> </div>
            <hr class="w-70"/>
          </div>
          <div class="row">
            {% for x in rows %}
            <!--gallery box-->
            <div class="col-sm-3 mb-4">
              <div class="bg-light shadow-lg p1">
              <img src="/{{x.picture}}" class="img-thumbnail"/>
              <b class="text-center p-1 d-block">{{x.title}}</b>
              </div>
            </div>
            <!--gallery box end-->
            {% endfor %}
          </div>
        </div>
       </div>
      <!-- end gallery-->
{% endblock%}

{% extends 'base.html'%}
{% load static%}
{% block childpage %}
<!--contact-->
       <div class="row contact py-5 ">
         <div class="col-sm-10 mx-auto">
          
          <div class="row">
            <div class="col-sm-5">
              {% if msg %}
              <div class="alert alert-success">{{msg}}
                <b class="float-end text-danger fs-5" data-bs-dismiss="alert">x</b></div>
              {% endif %}
              <form method="post">
                {% csrf_token%}
                 <input type="text" placeholder="Name" name="name" required class="form-control"/>
                 <input type="number" placeholder="Mobile No" name="mobile" required class="form-control"/>
                 <input type="email" placeholder="Email"required name="email" class="form-control"/>
                 <textarea placeholder="Message" required  name="msg" class="form-control txta"></textarea>
                 <input type="submit" value="Save" class="btn1 bg-color1"/>
              </form>

              

            </div>
            <div class="col-sm-7">
              <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3558.161150936287!2d80.96383930978877!3d26.898380260611283!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x39995785d5f7f1a5%3A0xffa47f1efe103f0d!2sTechpile%20Technology%20Private%20Limited!5e0!3m2!1sen!2sin!4v1784548325956!5m2!1sen!2sin" class="w-100" height="320px" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
          </div>
         </div>
       </div>
      <!-- end contact-->
{% endblock%}
